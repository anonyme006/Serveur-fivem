<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Concessionnaire</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>
    <div id="app" class="hidden">
        <aside class="panel">
            <header class="panel-header">
                <h1 id="shop-title" class="brand">Voiture</h1>
                <span class="fivem-tag">FiveM</span>
                <div class="logo" aria-hidden="true">
                    <img src="img/logo.svg" alt="VIBE" />
                </div>
            </header>

            <nav id="categories" class="categories" aria-label="Catégories"></nav>

            <div class="search-wrap">
                <svg class="search-icon" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
                    <circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/>
                    <path d="M16 16l4.5 4.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
                <input
                    id="search"
                    type="text"
                    autocomplete="off"
                    spellcheck="false"
                    placeholder="Rechercher un véhicule..."
                />
            </div>

            <div id="vehicle-list" class="vehicle-list" role="list"></div>

            <footer class="panel-footer">
                <button id="btn-close" class="btn-ghost" type="button">Fermer</button>
                <button id="btn-buy" class="btn-buy" type="button" disabled>Acheter</button>
            </footer>
        </aside>

        <div id="confirm-modal" class="modal hidden">
            <div class="modal-card">
                <p id="confirm-text"></p>
                <div class="modal-actions">
                    <button id="confirm-cancel" class="btn-ghost" type="button">Annuler</button>
                    <button id="confirm-ok" class="btn-buy" type="button">Acheter</button>
                </div>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
