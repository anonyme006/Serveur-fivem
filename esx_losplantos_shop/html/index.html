<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Magasin Los Plantos</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app" class="hidden">
    <aside class="shop">
      <header class="shop__header">
        <div class="shop__banner">
          <img src="assets/header.jpg" alt="Los Plantos" class="shop__banner-img" />
          <div class="shop__logo" aria-hidden="true">Los Plantos</div>
        </div>
        <div class="shop__title" id="shopTitle">MAGASIN</div>
      </header>

      <ul class="shop__list" id="itemList" role="listbox" aria-label="Magasin"></ul>
    </aside>
  </div>

  <script src="app.js"></script>
</body>
</html>
