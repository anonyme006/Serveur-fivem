<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ESX Progressbar</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div id="progress-root" class="progress-root hidden" data-position="bottom">
        <div class="progress-wrap">
            <p id="progress-label" class="progress-label hidden"></p>
            <div class="progress-track" id="progress-track" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" role="progressbar">
                <div class="progress-fill" id="progress-fill"></div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
