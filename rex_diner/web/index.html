<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rex Diner Tablet</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div id="app" class="hidden">
        <div class="tablet-shell">
            <div class="tablet-bezel">
                <div class="tablet-camera"></div>
                <div class="tablet-screen">
                    <header class="topbar">
                        <div class="topbar-left">
                            <button class="nav-chip active" data-nav="dashboard" title="Dashboard">
                                <i class="fa-solid fa-house"></i>
                                <span>Dashboard</span>
                            </button>
                            <button class="icon-btn" id="btn-refresh" title="Actualiser">
                                <i class="fa-solid fa-rotate"></i>
                            </button>
                        </div>
                        <div class="topbar-right">
                            <button class="ghost-btn" id="btn-patch">
                                <i class="fa-regular fa-file-lines"></i>
                                <span>Patch Notes</span>
                            </button>
                            <div class="status-pill online" id="status-pill">
                                <i class="fa-solid fa-wifi"></i>
                                <span>En ligne</span>
                            </div>
                            <div class="user-card">
                                <div class="avatar" id="user-avatar">R</div>
                                <div class="user-meta">
                                    <strong id="user-name">Employé</strong>
                                    <span id="user-grade">Grade</span>
                                </div>
                            </div>
                            <button class="icon-btn" id="btn-theme" title="Thème">
                                <i class="fa-solid fa-sun"></i>
                            </button>
                            <button class="icon-btn danger" id="btn-close" title="Fermer">
                                <i class="fa-solid fa-right-from-bracket"></i>
                            </button>
                        </div>
                    </header>

                    <nav class="sidebar">
                        <button class="side-link active" data-nav="dashboard"><i class="fa-solid fa-chart-line"></i><span>Dashboard</span></button>
                        <button class="side-link" data-nav="sales"><i class="fa-solid fa-cash-register"></i><span>Caisse</span></button>
                        <button class="side-link" data-nav="products"><i class="fa-solid fa-burger"></i><span>Produits</span></button>
                        <button class="side-link" data-nav="recipes" data-perm="recipes"><i class="fa-solid fa-book-open"></i><span>Recettes</span></button>
                        <button class="side-link" data-nav="history"><i class="fa-solid fa-receipt"></i><span>Ventes</span></button>
                        <button class="side-link" data-nav="stock" data-perm="stock"><i class="fa-solid fa-boxes-stacked"></i><span>Stock</span></button>
                        <button class="side-link" data-nav="orders" data-perm="orders"><i class="fa-solid fa-cart-shopping"></i><span>Commandes</span></button>
                        <button class="side-link" data-nav="deliveries" data-perm="deliveries"><i class="fa-solid fa-truck"></i><span>Livraisons</span></button>
                        <button class="side-link" data-nav="employees" data-perm="employees"><i class="fa-solid fa-users"></i><span>Employés</span></button>
                        <button class="side-link" data-nav="billing" data-perm="billing"><i class="fa-solid fa-file-invoice-dollar"></i><span>Factures</span></button>
                        <button class="side-link" data-nav="settings" data-perm="settings"><i class="fa-solid fa-gear"></i><span>Paramètres</span></button>
                    </nav>

                    <main id="content" class="content"></main>

                    <footer class="tablet-footer">
                        <span id="footer-brand">REX DINER — GESTION RESTAURANT</span>
                        <span id="footer-clock">--:--:--</span>
                        <span>v1.0.0</span>
                    </footer>
                </div>
                <div class="tablet-buttons">
                    <span>P1</span>
                    <span>+</span>
                    <span>−</span>
                    <span class="power"></span>
                </div>
            </div>
        </div>

        <div id="modal" class="modal hidden">
            <div class="modal-card" id="modal-card"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
