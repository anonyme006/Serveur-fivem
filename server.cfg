# =============================================================================
# Serveur FiveM — base type "Vibe / Qbox RP"
# Recréation structurée d'après l'analyse des ressources du serveur de référence
# =============================================================================

endpoint_add_tcp "0.0.0.0:30120"
endpoint_add_udp "0.0.0.0:30120"

# --- Identité serveur --------------------------------------------------------
sv_hostname "Mon Serveur RP | Qbox"
sets sv_projectName "Mon Serveur RP"
sets sv_projectDesc "Roleplay FR — Qbox + Ox"
sets tags "roleplay, fr, qbox, ox, rp"
sets locale "fr-FR"
load_server_icon "config/server-icon.png"

# --- Licence & OneSync -------------------------------------------------------
# Remplace par ta clé CFX : https://portal.cfx.re/
sv_licenseKey "CHANGE_ME"
set onesync on
set sv_enforceGameBuild 3095
sv_maxclients 48

# --- MySQL (oxmysql) ---------------------------------------------------------
# Format: mysql://user:password@host/database?charset=utf8mb4
set mysql_connection_string "mysql://root:password@127.0.0.1/fivem_qbox?charset=utf8mb4"

# --- Sécurité / performance --------------------------------------------------
sv_scriptHookAllowed 0
set sv_enableNetworkedSounds false
set sv_enableNetworkedScriptEntityStates false
set resources_useSystemChat true

# Steam / Discord (optionnel)
# set steam_webApiKey ""
# set discord_botToken ""

# =============================================================================
# ORDRE DE DÉMARRAGE — ne pas mélanger
# =============================================================================

# 1) Base CFX
ensure mapmanager
ensure chat
ensure spawnmanager
ensure sessionmanager
ensure basic-gamemode
ensure hardcap
ensure baseevents

# 2) Database + libs Ox
ensure oxmysql
ensure ox_lib
ensure ox_target
ensure ox_doorlock
ensure ox_inventory

# 3) Voice
ensure pma-voice
ensure [voice]

# 4) Framework Qbox
ensure qbx_core
ensure [qbx]

# 5) UI / outils standalone
ensure [standalone]

# 6) Téléphone
ensure [phone]

# 7) Logement
ensure [housing]

# 8) Jobs légaux
ensure [jobs]

# 9) Activités illégales / crimi
ensure [crimi]

# 10) Scripts custom "vibe" (à développer / adapter)
ensure [vibe]

# 11) Maps / MLO / props (lourds — après le gameplay)
ensure bob74_ipl
ensure [maps]
ensure [stream]

# 12) Véhicules
ensure [vehicles]

# =============================================================================
# Permissions ACE (exemple)
# =============================================================================
add_ace group.admin command allow
add_ace group.admin command.quit deny
add_principal identifier.fivem:CHANGEME group.admin
