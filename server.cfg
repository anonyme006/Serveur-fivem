# Serveur RP Qbox — configuration principale (FR)
# Remplacez les placeholders avant démarrage.

endpoint_add_tcp "0.0.0.0:30120"
endpoint_add_udp "0.0.0.0:30120"

sv_maxclients 48
set steam_webApiKey "none"
sets tags "qbox, rp, fr, ox"
sv_hostname "Serveur RP Qbox"
sets sv_projectName "Serveur RP Qbox"
sets sv_projectDesc "Base Qbox française — ox_lib / ox_inventory / ox_target"
sets locale "fr-FR"
set sv_enforceGameBuild 3258

# MariaDB ≥ 10.9.0
set mysql_connection_string "mysql://user:password@localhost/qbox?charset=utf8mb4"

# Chat
set resources_useSystemChat true
set qbx_chat:joinMessage "^2%s a rejoint le serveur"
set qbx_chat:quitMessage "^1%s a quitté le serveur (%s)"

exec voice.cfg

# Qbox
setr qb_locale "fr"
setr qbx:enableBridge "true"
set qbx:enableQueue "true"
set qbx:bucketLockdownMode "inactive"
set qbx:discordLink "discord.gg/votreserveur"
set qbx:max_jobs_per_player 1
set qbx:max_gangs_per_player 1
set qbx:setjob_replaces "true"
set qbx:setgang_replaces "true"
set qbx:cleanPlayerGroups "true"
set qbx:allowMethodOverrides "true"
set qbx:disableOverrideWarning "false"
setr qbx:enableVehiclePersistence "false"
setr qbx:vehiclePersistenceType "semi"
set qbx:acknowledge "true"
setr qbx:enableGroupManagement "false"

setr qbx:motd "<p style='padding:1rem;background:#141517;border:1px solid #373a40;border-radius:.5rem;text-align:center'><span style='color:#c8c828'>Bienvenue sur le serveur RP</span></p>"

setr illenium-appearance:locale "fr"
setr weather_disablecd true

exec ox.cfg

# Téléphone — adapter selon rp_phone_bridge
set npwd:framework "qbx"

# CFX defaults
ensure mapmanager
ensure chat
ensure spawnmanager
ensure sessionmanager
stop basic-gamemode
ensure hardcap
ensure baseevents

# === ORDRE DE DÉMARRAGE (critique) ===
ensure oxmysql
ensure ox_lib
ensure qbx_core
ensure ox_target
ensure ox_inventory
ensure [ox]
ensure [qbx]
ensure [standalone]
ensure [voice]

# Couche custom FR cinéma (après Qbox / Ox)
ensure rp_core
ensure rp_logs
ensure rp_licenses
ensure rp_billing
ensure rp_business
ensure rp_phone_bridge
ensure rp_menu
ensure rp_admin
ensure rp_hud
# stop qbx_hud   # décommentez si qbx_hud entre en conflit
# ensure rp_garages      # optionnel — stoppez qbx_garages si activé

ensure [jobs]
ensure [business]
ensure [vehicles]
ensure [housing]
ensure [phone]
ensure [admin]
ensure [custom]

## Permissions ##
exec permissions.cfg
exec misc.cfg
sv_licenseKey "changeme"
