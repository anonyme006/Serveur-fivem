<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="duty_style.css" />
  <title>qbx_ressources</title>
</head>
<body>
  <!-- Portefeuille / trousseau -->
  <div id="app" class="hidden">
    <div class="wallet">
      <header>
        <div>
          <p class="eyebrow">Trousseau</p>
          <h1 id="title">Portefeuille</h1>
        </div>
        <button id="closeBtn" type="button" aria-label="Fermer">✕</button>
      </header>
      <p id="playerName" class="name"></p>
      <section class="accounts" id="accounts"></section>
      <section class="keys">
        <div class="keys-head">
          <h2 id="keysTitle">Trousseau de clés</h2>
        </div>
        <div id="keysList" class="keys-list"></div>
      </section>
    </div>
  </div>

  <!-- Toast duty -->
  <div id="toast" class="toast hidden">
    <span id="dot" class="dot"></span>
    <div class="text">
      <strong id="status">Service</strong>
      <small id="label"></small>
    </div>
  </div>

  <script src="app.js"></script>
  <script src="duty_app.js"></script>
</body>
</html>
