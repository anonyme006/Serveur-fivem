<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<title>Preview Banque</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#111}
  .bg{
    position:fixed;inset:0;
    background:
      radial-gradient(ellipse at 25% 35%, rgba(160,70,50,0.4), transparent 50%),
      radial-gradient(ellipse at 75% 65%, rgba(30,50,80,0.45), transparent 45%),
      linear-gradient(160deg, #3a2a28 0%, #1e2430 50%, #12161c 100%);
  }
</style>
<link rel="stylesheet" href="style.css"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
</head>
<body>
  <div class="bg"></div>
  <div id="mount"></div>
  <script>
    // Load index content inline-ish: redirect approach
    fetch('index.html').then(r=>r.text()).then(html=>{
      const doc = new DOMParser().parseFromString(html, 'text/html');
      document.getElementById('mount').innerHTML = doc.getElementById('app').outerHTML;
      // load app after DOM ready
      const s = document.createElement('script');
      s.src = 'app.js';
      document.body.appendChild(s);
    });
  </script>
</body>
</html>
