<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Banque</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet" />
</head>
<body>
  <div id="app" class="hidden">
    <div class="bank-shell" id="bankShell">
      <!-- Header -->
      <header class="bank-header">
        <div class="header-left">
          <div class="brand-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M3 10.5L12 4l9 6.5" />
              <path d="M5 10v8h14v-8" />
              <path d="M9 18v-4h6v4" />
              <path d="M2 18h20" />
            </svg>
          </div>
          <h1 id="panelTitle">Banque</h1>
        </div>
        <div class="header-right">
          <div class="total-block">
            <span class="total-label" id="totalLabel">SOLDE TOTAL</span>
            <span class="total-amount" id="totalBalance">$ 0</span>
          </div>
          <button class="icon-btn close-btn" id="closeBtn" title="Fermer" aria-label="Fermer">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M6 6l12 12M18 6L6 18" />
            </svg>
          </button>
        </div>
      </header>

      <div class="bank-body">
        <!-- Left: Accounts -->
        <aside class="col accounts-col">
          <h2 class="col-title">COMPTES</h2>

          <div class="section-label">Personnel</div>
          <div id="personalAccounts" class="account-list"></div>

          <div class="section-label business-label" id="businessSectionLabel">Entreprise</div>
          <div id="businessAccounts" class="account-list"></div>

          <div class="favorites-block" id="favoritesBlock">
            <div class="section-label">Comptes favoris</div>
            <div class="add-fav-row">
              <input type="text" id="favName" placeholder="Nom du compte" maxlength="64" />
              <input type="text" id="favNumber" placeholder="N° de compte" maxlength="64" />
              <button class="plus-btn" id="addFavBtn" title="Ajouter">+</button>
            </div>
            <div id="favoritesList" class="favorites-list"></div>
          </div>
        </aside>

        <!-- Center: Transactions -->
        <main class="col transactions-col">
          <div class="tx-header">
            <div class="tx-title-row">
              <h2 class="col-title">TRANSACTIONS</h2>
              <span class="tx-badge" id="txBadge">—</span>
            </div>
            <span class="tx-balance" id="selectedBalance">$ 0</span>
          </div>
          <div class="tx-list" id="txList">
            <div class="tx-empty" id="txEmpty">
              <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.5">
                <rect x="12" y="8" width="24" height="32" rx="2" />
                <path d="M18 16h12M18 22h12M18 28h8" />
              </svg>
              <p>Aucune transaction pour ce compte</p>
            </div>
          </div>
        </main>

        <!-- Right: Actions -->
        <aside class="col actions-col">
          <h2 class="col-title actions-title">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
              <path d="M13 2L4 14h7l-1 8 10-14h-7l1-6z" />
            </svg>
            ACTIONS
          </h2>
          <div class="action-stack">
            <button class="action-btn" data-action="transfer">
              <span class="action-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M7 8h12M15 4l4 4-4 4M17 16H5M9 20l-4-4 4-4" />
                </svg>
              </span>
              <span>Virement</span>
            </button>
            <button class="action-btn" data-action="deposit">
              <span class="action-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M12 4v12M6 12l6 6 6-6" />
                </svg>
              </span>
              <span>Dépôt</span>
            </button>
            <button class="action-btn active" data-action="withdraw">
              <span class="action-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M12 20V8M6 12l6-6 6 6" />
                </svg>
              </span>
              <span>Retrait</span>
            </button>
            <button class="action-btn" data-action="csv">
              <span class="action-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M8 4h8l4 4v12H8z" />
                  <path d="M16 4v4h4M10 13h6M10 17h6" />
                </svg>
              </span>
              <span>Relevé CSV</span>
            </button>
          </div>
        </aside>
      </div>
    </div>

    <!-- Modal actions -->
    <div class="modal-overlay hidden" id="modal">
      <div class="modal">
        <div class="modal-header">
          <h3 id="modalTitle">Action</h3>
          <button class="icon-btn" id="modalClose" aria-label="Fermer">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M6 6l12 12M18 6L6 18" />
            </svg>
          </button>
        </div>
        <div class="modal-body" id="modalBody">
          <!-- filled by JS -->
        </div>
        <div class="modal-footer">
          <button class="btn ghost" id="modalCancel">Annuler</button>
          <button class="btn primary" id="modalConfirm">Confirmer</button>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
