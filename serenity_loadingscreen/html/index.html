<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Serenity V RP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="atmosphere" aria-hidden="true">
    <div class="glow glow-sunset"></div>
    <div class="glow glow-cyan"></div>
    <div class="grain"></div>
    <canvas id="particles"></canvas>
  </div>

  <main class="stage">
    <header class="brand">
      <img class="logo" src="logo.jpg" alt="Serenity V RP" draggable="false" />
      <p class="tagline" id="tagline">Bienvenue à Los Santos</p>
    </header>
    <p class="tip" id="tip"></p>
  </main>

  <aside class="audio-dock" id="audioDock" aria-label="Contrôles audio">
    <div class="audio-controls">
      <button type="button" class="audio-btn" id="playBtn" aria-label="Lancer la musique" title="Play">
        <span class="audio-icon" aria-hidden="true">▶</span>
        <span class="audio-label">PLAY</span>
      </button>
      <button type="button" class="audio-btn" id="stopBtn" aria-label="Arrêter la musique" title="Stop">
        <span class="audio-icon" aria-hidden="true">■</span>
        <span class="audio-label">STOP</span>
      </button>
    </div>
    <div class="volume-row">
      <button type="button" class="volume-step" id="volDownBtn" aria-label="Baisser le volume">−</button>
      <input type="range" class="volume-slider" id="volumeSlider" min="0" max="100" value="35" aria-label="Volume" />
      <button type="button" class="volume-step" id="volUpBtn" aria-label="Augmenter le volume">+</button>
      <span class="volume-pct" id="volumePct">35%</span>
    </div>
  </aside>

  <audio id="loadingMusic" preload="auto" loop></audio>

  <section class="load-dock" aria-label="Chargement du serveur">
    <p class="load-status" id="loadLabel">Connexion au serveur…</p>
    <div class="bar-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <div class="bar-fill" id="barFill"></div>
    </div>
    <p class="load-percent" id="loadPct">0%</p>
    <div class="footer">
      <span class="dot"></span>
      <span>SERENITY V · RP</span>
    </div>
  </section>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
